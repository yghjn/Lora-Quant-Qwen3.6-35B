# 量化线的 conda 环境。只要 torch + safetensors。
#
#     conda env create -f env/quant.yml
#     conda activate lqq-quant
#     python -I verify/test_core_cpu.py
#     python -I verify/test_fakequant_cpu.py
#
# 刻意不钉 torch 的精确版本:量化线只用 torch 的通用算子
# (linalg.cholesky / solve_triangular / matmul / round),2.7 起都可以。
# 已在 torch 2.7.1+cpu 上跑过全部自测。
#
# **不需要 torch_npu**。量化可以纯 CPU 做(实测约 8 小时);
# 想用 NPU 加速 `ldlq` 里的矩阵乘,再在本环境里按目标机的 CANN 版本
# 额外装配套的 torch_npu 即可,核心代码不用改(张量的 device 跟着输入走)。
name: lqq-quant
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch>=2.7
      - safetensors>=0.4
      - numpy
