# 量化线的 conda 环境 —— **只建环境,不装包**。
#
# 刻意不写 pip: 段。`conda env create` 会在 conda 操作内部调 pip,而本机的约束是
# conda 要走 proxy、pip 必须关掉 proxy —— 两者不能在同一个进程里同时满足。
# 所以包的安装挪到了 env/2_pip_quant.sh(无 proxy 阶段)。
#
#     bash env/1_conda_envs.sh      # proxy 开
#     bash env/2_pip_quant.sh       # proxy 关
name: lqq-quant
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
